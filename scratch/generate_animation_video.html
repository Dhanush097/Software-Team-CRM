<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Record CRM Intro Animation Video</title></head>
<body style="margin:0;background:#140708;overflow:hidden;">
<canvas id="c" width="800" height="450" style="width:800px;height:450px;"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Brand colors
const BURGUNDY = '#781B1B';
const BURGUNDY_DARK = '#551414';
const CHAMPAGNE = '#E9D5C2';
const BEIGE = '#F8F4EC';
const SAGE = '#8A7D73';
const EMERALD = '#10B981';

const stream = canvas.captureStream(30);
const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
const chunks = [];

recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
recorder.onstop = () => {
  const blob = new Blob(chunks, { type: 'video/webm' });
  const reader = new FileReader();
  reader.onloadend = () => {
    window.recordedBase64 = reader.result;
    document.title = 'RECORDING_COMPLETE';
  };
  reader.readAsDataURL(blob);
};

let startTime = null;
const DURATION = 6000; // 6 seconds loop

function draw(ts) {
  if (!startTime) {
    startTime = ts;
    recorder.start();
  }
  const elapsed = ts - startTime;
  const progress = Math.min(elapsed / DURATION, 1);

  // Background
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#1A0B0E');
  grad.addColorStop(0.5, '#260F13');
  grad.addColorStop(1, '#120608');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Ambient glows
  ctx.save();
  ctx.fillStyle = 'rgba(120, 27, 27, 0.25)';
  ctx.filter = 'blur(40px)';
  ctx.beginPath();
  ctx.arc(W * 0.3 + Math.sin(elapsed * 0.002) * 40, H * 0.4, 120, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(233, 213, 194, 0.15)';
  ctx.beginPath();
  ctx.arc(W * 0.7 + Math.cos(elapsed * 0.002) * 40, H * 0.6, 100, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Floating particles
  for (let i = 0; i < 15; i++) {
    const px = (W * 0.1 + (i * 53 + elapsed * 0.03)) % W;
    const py = (H * 0.2 + (i * 37 + Math.sin(elapsed * 0.003 + i) * 20)) % H;
    ctx.fillStyle = i % 2 === 0 ? 'rgba(233, 213, 194, 0.4)' : 'rgba(120, 27, 27, 0.5)';
    ctx.beginPath();
    ctx.arc(px, py, 2 + (i % 3), 0, Math.PI * 2);
    ctx.fill();
  }

  // Central Card Showcase
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
  ctx.shadowBlur = 30;
  ctx.fillStyle = 'rgba(255, 254, 252, 0.96)';
  ctx.strokeStyle = '#E8DDD1';
  ctx.lineWidth = 2;
  const cardX = 90, cardY = 50, cardW = 620, cardH = 350, cardR = 24;
  ctx.beginPath();
  ctx.roundRect(cardX, cardY, cardW, cardH, cardR);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // Top header in card
  // Logo Icon
  ctx.fillStyle = BURGUNDY;
  ctx.beginPath();
  ctx.roundRect(cardX + 24, cardY + 20, 36, 36, 10);
  ctx.fill();
  // Logo 3 Bars
  ctx.fillStyle = SAGE;
  ctx.fillRect(cardX + 31, cardY + 38, 4, 10);
  ctx.fillStyle = CHAMPAGNE;
  ctx.fillRect(cardX + 39, cardY + 32, 4, 16);
  ctx.fillStyle = '#FFFEFC';
  ctx.fillRect(cardX + 47, cardY + 26, 4, 22);

  // Logo Text
  ctx.font = 'bold 18px "Plus Jakarta Sans", sans-serif';
  ctx.fillStyle = '#651717';
  ctx.fillText('Software CRM', cardX + 70, cardY + 38);
  ctx.font = 'bold 8px "Plus Jakarta Sans", sans-serif';
  ctx.fillStyle = '#8A7D73';
  ctx.fillText('ENTERPRISE TEAM PLATFORM', cardX + 70, cardY + 50);

  // Live Pulse Beacon
  const ping = (elapsed % 1500) / 1500;
  ctx.fillStyle = 'rgba(16, 185, 129, ' + (1 - ping) * 0.6 + ')';
  ctx.beginPath();
  ctx.arc(cardX + cardW - 130, cardY + 36, 4 + ping * 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = EMERALD;
  ctx.beginPath();
  ctx.arc(cardX + cardW - 130, cardY + 36, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.font = 'bold 10px sans-serif';
  ctx.fillStyle = EMERALD;
  ctx.fillText('LIVE SPRINT', cardX + cardW - 118, cardY + 40);

  // Left Section: Metrics
  // Velocity bar
  ctx.font = 'bold 12px sans-serif';
  ctx.fillStyle = '#25211F';
  ctx.fillText('Sprint 48 Delivery', cardX + 30, cardY + 95);
  ctx.fillStyle = BURGUNDY;
  ctx.fillText('88% On Track', cardX + 220, cardY + 95);

  ctx.fillStyle = '#E8DDD1';
  ctx.beginPath();
  ctx.roundRect(cardX + 30, cardY + 105, 270, 8, 4);
  ctx.fill();

  const progW = Math.min(270 * 0.88, 270 * (elapsed / 2500));
  const barGrad = ctx.createLinearGradient(cardX + 30, 0, cardX + 300, 0);
  barGrad.addColorStop(0, BURGUNDY);
  barGrad.addColorStop(0.7, CHAMPAGNE);
  barGrad.addColorStop(1, '#FFFEFC');
  ctx.fillStyle = barGrad;
  ctx.beginPath();
  ctx.roundRect(cardX + 30, cardY + 105, progW, 8, 4);
  ctx.fill();

  // Metrics Boxes
  ctx.fillStyle = '#F8F4EC';
  ctx.strokeStyle = '#E8DDD1';
  ctx.beginPath();
  ctx.roundRect(cardX + 30, cardY + 130, 125, 70, 12);
  ctx.fill(); ctx.stroke();
  ctx.font = 'bold 9px sans-serif';
  ctx.fillStyle = SAGE;
  ctx.fillText('TASKS CLOSED', cardX + 45, cardY + 150);
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = '#651717';
  ctx.fillText('142', cardX + 45, cardY + 180);
  ctx.font = 'bold 10px sans-serif';
  ctx.fillStyle = EMERALD;
  ctx.fillText('/ 156', cardX + 90, cardY + 180);

  ctx.fillStyle = '#F8F4EC';
  ctx.beginPath();
  ctx.roundRect(cardX + 175, cardY + 130, 125, 70, 12);
  ctx.fill(); ctx.stroke();
  ctx.font = 'bold 9px sans-serif';
  ctx.fillStyle = SAGE;
  ctx.fillText('CASH FLOW', cardX + 190, cardY + 150);
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = '#651717';
  ctx.fillText('$48.9K', cardX + 190, cardY + 180);
  ctx.font = 'bold 10px sans-serif';
  ctx.fillStyle = EMERALD;
  ctx.fillText('+18%', cardX + 265, cardY + 180);

  // Animated Chart Bars below metrics
  for (let b = 0; b < 6; b++) {
    const bh = 15 + Math.sin(elapsed * 0.005 + b) * 12;
    ctx.fillStyle = b === 4 ? BURGUNDY : (b % 2 === 0 ? SAGE : CHAMPAGNE);
    ctx.beginPath();
    ctx.roundRect(cardX + 30 + b * 45, cardY + 220 + (30 - bh), 30, bh, 4);
    ctx.fill();
  }

  // Right Section: Team Desk SVG Animation
  const deskX = cardX + 330, deskY = cardY + 80;
  ctx.fillStyle = '#FAF6EE';
  ctx.strokeStyle = '#E8DDD1';
  ctx.beginPath();
  ctx.roundRect(deskX, deskY, 260, 220, 16);
  ctx.fill(); ctx.stroke();

  // Table
  ctx.fillStyle = '#D9C0AB';
  ctx.fillRect(deskX + 20, deskY + 150, 220, 8);
  ctx.fillStyle = '#D7C4B5';
  ctx.fillRect(deskX + 40, deskY + 158, 6, 35);
  ctx.fillRect(deskX + 214, deskY + 158, 6, 35);

  // Center Monitor
  ctx.fillStyle = '#FFFEFC';
  ctx.strokeStyle = '#D7C4B5';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(deskX + 105, deskY + 90, 50, 36);
  ctx.fillRect(deskX + 105, deskY + 90, 50, 36);
  ctx.fillStyle = '#D7C4B5';
  ctx.fillRect(deskX + 126, deskY + 126, 8, 24);

  // Pulsing screen mini bars
  for (let s = 0; s < 4; s++) {
    const sbh = 10 + Math.sin(elapsed * 0.006 + s * 1.2) * 6;
    ctx.fillStyle = s === 2 ? BURGUNDY : (s === 1 ? CHAMPAGNE : SAGE);
    ctx.fillRect(deskX + 112 + s * 9, deskY + 120 - sbh, 6, sbh);
  }

  // Left Character (DH)
  ctx.fillStyle = BURGUNDY;
  ctx.beginPath(); ctx.arc(deskX + 60, deskY + 85, 14, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(deskX + 60, deskY + 130, 20, Math.PI, 0); ctx.fill();

  // Right Character (PV)
  ctx.fillStyle = CHAMPAGNE;
  ctx.beginPath(); ctx.arc(deskX + 200, deskY + 85, 14, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = BURGUNDY; ctx.stroke();
  ctx.fillStyle = SAGE;
  ctx.beginPath(); ctx.arc(deskX + 200, deskY + 130, 20, Math.PI, 0); ctx.fill();

  // Dynamic dashed collaboration line
  ctx.save();
  ctx.strokeStyle = BURGUNDY;
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.lineDashOffset = -(elapsed * 0.04);
  ctx.beginPath();
  ctx.moveTo(deskX + 70, deskY + 85);
  ctx.quadraticCurveTo(deskX + 130, deskY + 50, deskX + 190, deskY + 85);
  ctx.stroke();
  ctx.restore();

  // Video Watermark / Badge
  ctx.fillStyle = 'rgba(120, 27, 27, 0.9)';
  ctx.beginPath();
  ctx.roundRect(cardX + 20, cardY + cardH - 35, 180, 22, 6);
  ctx.fill();
  ctx.fillStyle = '#FFF';
  ctx.font = 'bold 9px sans-serif';
  ctx.fillText('▶ SOFTWARE CRM INTRO VIDEO', cardX + 30, cardY + cardH - 21);

  if (elapsed < DURATION) {
    requestAnimationFrame(draw);
  } else {
    recorder.stop();
  }
}

requestAnimationFrame(draw);
</script>
</body>
</html>
